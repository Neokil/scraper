name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: scrape-api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            scrape-api/package-lock.json
            worker/package-lock.json
      - name: Install contract and web dependencies
        working-directory: scrape-api
        run: npm ci --ignore-scripts
      - name: Generate pinned web assets
        working-directory: scrape-api
        run: npm run generate
      - name: Validate OpenAPI
        working-directory: scrape-api
        run: npm run lint:openapi
      - name: Check Go formatting
        run: |
          gofmt -w scrape-api/cmd scrape-api/internal scrape-api/web scrape-api/api
          git diff --exit-code
      - name: Test Go
        working-directory: scrape-api
        run: |
          go vet ./...
          go test -race ./...
          go build ./cmd/scrape-api
      - name: Install and test worker
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test
      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          shellcheck scrape-api/scripts/*.sh deploy/docker/*.sh deploy/proxmox/*.sh test/e2e/*.sh
          bats deploy/proxmox/test

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 images
        run: |
          docker buildx build --platform linux/amd64 --file scrape-api/Dockerfile .
          docker buildx build --platform linux/amd64 --file worker/Dockerfile .
      - name: Build arm64 images
        run: |
          docker buildx build --platform linux/arm64 --file scrape-api/Dockerfile .
          docker buildx build --platform linux/arm64 --file worker/Dockerfile .

  end-to-end:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start stack
        run: docker compose up --build --wait
      - name: Run browser smoke tests
        run: |
          ./test/e2e/smoke.sh
          ./test/e2e/recovery.sh
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
